<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#260416"/>
      <stop offset="100%" stop-color="#0d0107"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.35"/>
  <g filter="url(#glow)">
    <!-- Flask Neck -->
    <rect x="58" y="28" width="12" height="24" rx="2" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <rect x="54" y="26" width="20" height="6" rx="3" fill="#be185d" stroke="#fbcfe8" stroke-width="1.5"/>
    <!-- Flask Body -->
    <path d="M58 50L36 86c-4 7 1 14 9 14h38c8 0 13-7 9-14L70 50H58z" fill="#9d174d" fill-opacity="0.75" stroke="url(#pink)" stroke-width="2.5"/>
    <!-- Liquid Level -->
    <path d="M43 76l6-10c4-4 8 0 12 0s8-4 12 0l7 10c-3 8-12 16-24 16s-21-8-24-16" fill="#ec4899" fill-opacity="0.8"/>
    <!-- Bubbles -->
    <circle cx="56" cy="80" r="3" fill="#fbcfe8"/>
    <circle cx="68" cy="74" r="2.5" fill="#fdf2f8"/>
    <circle cx="62" cy="62" r="2" fill="#f472b6"/>
    <circle cx="64" cy="40" r="1.5" fill="#fbcfe8"/>
  </g>
</svg>
