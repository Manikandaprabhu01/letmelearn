<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051c14"/>
      <stop offset="100%" stop-color="#020806"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="128" x2="128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Circuits -->
  <path d="M20 44h20l12 12h24" stroke="#059669" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <path d="M108 84h-20l-12-12h-24" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <!-- Neural AI Core -->
  <g filter="url(#glow)">
    <!-- Hexagon Core -->
    <polygon points="64,28 92,44 92,76 64,92 36,76 36,44" fill="#064e3b" fill-opacity="0.6" stroke="url(#emerald)" stroke-width="2.5"/>
    <!-- Center Processor -->
    <rect x="52" y="52" width="24" height="24" rx="6" fill="#047857" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="64" cy="64" r="5" fill="#a7f3d0"/>
    <!-- Radiating Nodes -->
    <circle cx="64" cy="28" r="4" fill="#34d399"/>
    <circle cx="92" cy="44" r="4" fill="#06b6d4"/>
    <circle cx="92" cy="76" r="4" fill="#34d399"/>
    <circle cx="64" cy="92" r="4" fill="#10b981"/>
    <circle cx="36" cy="76" r="4" fill="#06b6d4"/>
    <circle cx="36" cy="44" r="4" fill="#34d399"/>
    <!-- Connecting beams -->
    <line x1="64" y1="52" x2="64" y2="32" stroke="#6ee7b7" stroke-width="1.5"/>
    <line x1="64" y1="76" x2="64" y2="88" stroke="#6ee7b7" stroke-width="1.5"/>
    <line x1="52" y1="64" x2="40" y2="64" stroke="#34d399" stroke-width="1.5"/>
    <line x1="76" y1="64" x2="88" y2="64" stroke="#34d399" stroke-width="1.5"/>
  </g>
</svg>
