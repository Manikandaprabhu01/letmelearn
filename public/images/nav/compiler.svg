<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1c04"/>
      <stop offset="100%" stop-color="#040b01"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.35"/>
  <g filter="url(#glow)">
    <!-- Terminal Window -->
    <rect x="28" y="32" width="72" height="64" rx="10" fill="#14532d" fill-opacity="0.75" stroke="url(#lime)" stroke-width="2.5"/>
    <!-- Window Bar -->
    <line x1="28" y1="46" x2="100" y2="46" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="38" cy="39" r="2.5" fill="#f87171"/>
    <circle cx="46" cy="39" r="2.5" fill="#facc15"/>
    <circle cx="54" cy="39" r="2.5" fill="#4ade80"/>
    <!-- Code Prompt: >_ -->
    <path d="M42 58l10 8-10 8" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="58" y1="74" x2="72" y2="74" stroke="#bef264" stroke-width="3" stroke-linecap="round"/>
    <!-- Code line below -->
    <line x1="42" y1="84" x2="82" y2="84" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
</svg>
