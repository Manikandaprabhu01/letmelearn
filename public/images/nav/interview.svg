<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241403"/>
      <stop offset="100%" stop-color="#0d0801"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35"/>
  <g filter="url(#glow)">
    <!-- Tech Trophy / Target Emblem -->
    <!-- Pedestal Base -->
    <path d="M34 94h60l-6-10H40l-6 10z" fill="#78350f" stroke="url(#gold)" stroke-width="2"/>
    <!-- Stem -->
    <rect x="58" y="74" width="12" height="10" rx="2" fill="#b45309" stroke="#fde047" stroke-width="1.5"/>
    <!-- Cup / Hex Badge -->
    <path d="M42 42h44l-6 26c-2 8-8 12-16 12s-14-4-16-12L42 42z" fill="#92400e" fill-opacity="0.8" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Handles -->
    <path d="M42 46c-10 0-14 8-10 16 3 6 8 8 12 8" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M86 46c10 0 14 8 10 16-3 6-8 8-12 8" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <!-- Center Star -->
    <polygon points="64,48 67,56 75,56 68,61 71,69 64,64 57,69 60,61 53,56 61,56" fill="#fef08a" stroke="#d97706" stroke-width="0.8"/>
  </g>
</svg>
