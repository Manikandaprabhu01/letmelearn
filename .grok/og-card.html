<style>
  @font-face {
    font-family: "Fraunces";
    src: url("file:///workspace/.grok/fonts/Fraunces.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("file:///workspace/.grok/fonts/IBMPlexSans.ttf") format("truetype");
    font-weight: 100 700;
    font-style: normal;
    font-display: block;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    background: #0b0c0e;
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #0b0c0e;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,230,225,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,230,225,0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 78% 70% at 50% 48%, black 8%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse 78% 70% at 50% 48%, black 8%, transparent 72%);
  }
  svg.graph {
    position: absolute;
    inset: 0;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 72% 68% at 50% 48%, transparent 42%, #0b0c0e 100%);
    pointer-events: none;
  }
  .lockup {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #e8e6e1;
    width: 920px;
  }
  .mark {
    display: block;
    margin: 0 auto 18px;
  }
  h1 {
    margin: 0;
    font-family: "Fraunces", "Liberation Serif", serif;
    font-weight: 520;
    font-size: 176px;
    line-height: 0.9;
    letter-spacing: 0.06em;
    font-optical-sizing: auto;
    font-variation-settings: "SOFT" 12, "WONK" 0, "opsz" 144;
    color: #e8e6e1;
  }
  .rule {
    width: 64px;
    height: 1px;
    background: #9eb4c8;
    margin: 26px auto 18px;
    opacity: 0.85;
  }
  p {
    margin: 0;
    font-family: "IBM Plex Sans", "Liberation Sans", sans-serif;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8b8d93;
  }
</style>
</head>
